<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Defines the character set used by the page. -->
  <meta charset="UTF-8">
  <!-- Keeps the recovery form responsive on smaller screens. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Describes the page in the browser tab. -->
  <title>Reset Password | LearnerHub</title>
  <!-- Loads the shared reset page styles. -->
  <link rel="stylesheet" href="reset.css">
</head>

<body>
  <!-- Main landmark contains the password recovery workflow. -->
  <main class="reset-page">
    <form id="resetPanel" class="auth-form reset-form">
      <!-- Uses the same animated LearnerHub logo as the login and register pages. -->
      <header class="brand-logo">
        <img src="logoImage.png.png" alt="LearnerHub logo">
      </header>

      <section class="form-section" aria-labelledby="reset-heading">
        <!-- Heading identifies the purpose of this form section. -->
        <h1 id="reset-heading">Reset your password</h1>

        <!-- Email identifies the account that needs recovery. -->
        <label for="resetEmail">Account email</label>
        <input id="resetEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
        <p>We’ll email you a secure link to choose a new password.</p>

        <label id="newPasswordLabel" for="newPassword" hidden>New password</label>
        <div id="newPasswordField" class="password-field" hidden>
          <input id="newPassword" type="password" autocomplete="new-password" minlength="6"
            placeholder="At least 6 characters">
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false"
            data-toggle-password="newPassword">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6-6-10 6S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

      </section>

      <!-- Live region displays password reset feedback without a page reload. -->
      <p id="resetMessage" class="message" role="status" aria-live="polite" aria-busy="false">
        <span id="resetMessageText"></span>
        <span id="resetLoader" class="inline-loader" aria-hidden="true" hidden></span>
      </p>

      <footer class="form-actions">
        <!-- Requests a Firebase password reset email. -->
        <button id="resetButton" class="primary-button" type="submit">Send reset link</button>
        <!-- Provides navigation to the other account actions. -->
        <nav class="account-links" aria-label="Account options">
          <a href="login.html">Back to login</a>
          <a href="register.html">Create account</a>
        </nav>
      </footer>
    </form>
  </main>
  <!-- Loads the Firebase password reset workflow. -->
  <script type="module" src="reset.js"></script>
</body>

</html>
