<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Defines the character set used by the page. -->
    <meta charset="UTF-8">
  <!-- Keeps the recovery form responsive on smaller screens. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Describes the page in the browser tab. -->
    <title>Reset Password | LearnerHub</title>
  <!-- Loads the shared reset page styles. -->
    <link rel="stylesheet" href="reset.css">
</head>
<body>
    <!-- Main landmark contains the password recovery workflow. -->
    <main class="reset-page">
      <form id="resetPanel" class="auth-form reset-form" novalidate>
        <!-- Uses the same animated LearnerHub logo as the login and register pages. -->
        <header class="brand-logo">
          <img src="logoImage.png.png" alt="LearnerHub logo">
        </header>

        <section class="form-section" aria-labelledby="reset-heading">
          <!-- Heading identifies the purpose of this form section. -->
          <h1 id="reset-heading">Reset your password</h1>

          <!-- Email identifies the account that needs recovery. -->
          <label for="resetEmail">Account email</label>
          <input id="resetEmail" type="email" autocomplete="email" placeholder="you@example.com" required>

          <!-- Phone provides an alternative recovery contact. -->
          <label for="resetPhone">Phone number or recovery contact</label>
          <input id="resetPhone" type="tel" autocomplete="tel" placeholder="+27123456789">

          <!-- Radio buttons select where the verification code should be sent. -->
          <fieldset class="choice-group">
            <legend>Two-factor authentication</legend>
            <label><input type="radio" name="resetFactor" value="email" checked> Email OTP</label>
            <label><input type="radio" name="resetFactor" value="phone"> Phone OTP</label>
          </fieldset>

          <!-- Requests a one-time password using the selected recovery method. -->
          <button id="sendResetOtp" class="secondary-button" type="button">Send OTP</button>

          <!-- OTP field confirms ownership of the selected recovery contact. -->
          <label for="resetOtp">Confirm OTP</label>
          <input id="resetOtp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" required>

          <!-- New password replaces the old account password after verification. -->
          <label for="newPassword">New password</label>
          <div class="password-field">
            <input id="newPassword" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required>
            <!-- Eye button toggles whether the new password is visible. -->
            <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" data-toggle-password="newPassword">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </section>

        <!-- Live region displays OTP and validation feedback without a page reload. -->
        <p id="resetMessage" class="message" role="status" aria-live="polite"></p>

        <footer class="form-actions">
          <!-- Submits the completed password recovery form. -->
          <button id="resetButton" class="primary-button" type="submit">Reset password</button>
          <!-- Provides navigation to the other account actions. -->
          <nav class="account-links" aria-label="Account options">
            <a href="login.html">Back to login</a>
            <a href="register.html">Create account</a>
          </nav>
        </footer>
      </form>
    </main>
    <!-- Loads password visibility, OTP, and validation behavior. -->
    <script src="reset.js"></script>
</body>
</html>
