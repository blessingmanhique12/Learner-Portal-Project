<!-- Login page for the LearnerHub portal. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | LearnerHub</title>
  <!-- Reuses the register page brand system and adds login-only rules. -->
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <!-- Main landmark keeps the login experience centered and accessible. -->
  <main class="login-page">
    <form id="loginPanel" class="auth-form login-form" novalidate>
      <!-- The same logo and 3D treatment used by the register page. -->
      <header class="brand-logo">
        <img src="logoImage.png.png" alt="LearnerHub logo">
      </header>

      <section class="form-section" aria-labelledby="login-heading">
        <h1 id="login-heading">Welcome back</h1>

        <label for="loginEmail">Email address</label>
        <input id="loginEmail" type="email" autocomplete="email" placeholder="your.email@example.com" required>

        <label for="loginPassword">Password</label>
        <div class="password-field">
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          <!-- The script toggles this input between password and text types. -->
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" data-toggle-password="loginPassword">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <label for="loginRole">Login as</label>
        <select id="loginRole" required>
          <option value="learner">Learner</option>
          <option value="facilitator">Facilitator</option>
        </select>
      </section>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <!-- Primary action submits the credentials after browser validation. -->
      <footer class="form-actions">
        <button id="loginButton" class="primary-button" type="submit">Sign in</button>
        <nav class="account-links" aria-label="Account options">
          <a href="register.html">Create account</a>
          <a href="reset.html">Forgot password?</a>
        </nav>
      </footer>
    </form>
  </main>

  <!-- Provides password visibility and login feedback behavior. -->
  <script type="module" src="login.js"></script>
</body>
</html>
